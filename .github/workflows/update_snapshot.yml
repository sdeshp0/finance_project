name: Update data snapshot

on:
  schedule:
    # 22:00 UTC, weekdays - after US market close year-round (20:00/21:00 ET close + buffer)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build snapshot
        run: python scripts/build_snapshot.py

      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot_constituents.csv data/snapshot_prices.parquet data/snapshot_meta.json
          git diff --cached --quiet || git commit -m "Update data snapshot"
          git push