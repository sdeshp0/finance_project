name: Update data snapshot

on:
  schedule:
    # 22:00 UTC, weekdays - after US market close year-round (20:00/21:00 ET close + buffer)
    - cron: "0 22 * * 1-5"
    # Retry before the next open (Tue-Sat 06:00 UTC). Yahoo sometimes hasn't
    # published the day's bar by the first run; the app treats a snapshot that
    # misses the last close as stale and goes live, so this fills that gap.
    # Publishes only if something changed, so a redundant run is a no-op.
    - cron: "0 6 * * 2-6"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build snapshot
        run: python scripts/build_snapshot.py

      # The snapshot lives on the `data` branch as a single commit with no
      # parent, replaced on every run, so old copies never build up in git
      # history the way they did when it was committed to main.
      - name: Publish snapshot to the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip if prices and constituents match what's already published
          # (snapshot_meta.json always differs, since it records the run time).
          if git fetch --depth 1 origin data 2>/dev/null \
             && git show FETCH_HEAD:snapshot_prices.parquet | cmp -s - data/snapshot_prices.parquet \
             && git show FETCH_HEAD:snapshot_constituents.csv | cmp -s - data/snapshot_constituents.csv; then
            echo "Snapshot unchanged; nothing to publish."
            exit 0
          fi
          publish=$(mktemp -d)
          cp data/snapshot_constituents.csv data/snapshot_prices.parquet data/snapshot_meta.json "$publish"/
          cd "$publish"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Data snapshot $(jq -r .last_bar snapshot_meta.json)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
